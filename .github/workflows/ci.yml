name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: swift --version

      # Runs first: a failing expectation should stop the job before the
      # slower app build, and the suite needs no App Intents tooling.
      - name: Test
        run: ./test.sh

      - name: Build
        run: ./build.sh

      # The version was hand-maintained in Info.plist once and drifted: v0.1.1
      # and v0.2.0 both shipped announcing themselves as 0.1.0. Nothing catches
      # that by review, because the wrong number looks exactly like the right
      # one. A tag build is the only moment the two can be compared.
      - name: Check the tag matches VERSION
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          FILE="$(tr -d ' \t\n' < VERSION)"
          if [ "$TAG" != "$FILE" ]; then
            echo "tag $GITHUB_REF_NAME does not match VERSION ($FILE)" >&2
            exit 1
          fi
          # And what the build actually stamps, not just what the file says.
          BUILT="$(./build/nolid --version | awk '{print $2}')"
          PLIST="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' \
              build/NoLid.app/Contents/Info.plist)"
          test "$BUILT" = "$FILE"
          test "$PLIST" = "$FILE"

      - name: Check the CLI answers
        run: |
          # A binary too broken to do anything else must still say what it is.
          ./build/nolid --version | grep -q "^nolid [0-9]"
          ./build/nolid version | grep -q "^nolid [0-9]"
          # Asking for help must succeed. It did not, once.
          ./build/nolid --help > /dev/null
          ./build/nolid -h > /dev/null
          # No app running on a CI runner, so this must exit 1, not hang.
          ./build/nolid status && exit 1 || test $? -eq 1
          # An unknown option is a usage error, not a silent no-op.
          ./build/nolid status --bogus && exit 1 || test $? -eq 2
          # doctor works without the app. A CI runner has no built-in display,
          # so the probe skips and the exit code must still be 0 — reaching 4
          # here would mean it thinks it left a display unusable.
          ./build/nolid doctor --no-probe > /dev/null
          ./build/nolid doctor --json > /dev/null
          # Commands that turn displays off must refuse without the app.
          ./build/nolid off && exit 1 || test $? -eq 1

      - name: Check App Intents metadata was generated
        run: |
          test -f build/NoLid.app/Contents/Resources/Metadata.appintents/extract.actionsdata
          # Mangled names must carry the real module, or Shortcuts lists the
          # actions and fails to run them.
          grep -q '5NoLid' build/NoLid.app/Contents/Resources/Metadata.appintents/extract.actionsdata
